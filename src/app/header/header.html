
<!-- HEADER START -->
<header class="main-header">
  <nav class="navbar navbar-expand-lg navbar-light bg-white">
    <div class="container-fluid px-lg-5">

      <!-- BRAND LOGOS -->
      <div class="brand-section">

        <!-- Laxmi Diesels Logo -->
        <a class="navbar-brand laxmi-brand" href="#">
    <img
        src="logo.png"
        alt="Laxmi Diesels - Delighting you always"
        class="laxmi-logo"
    />
       </a>

        <div class="brand-divider"></div>

        <!-- VAYU Logo -->
        <a href="#" class="vayu-brand">
        <img
        src="Vayu.png" width="200"

    />

        <div class="authorised-divider"></div>

        <div class="authorised-text">
          Authorised<br>Partner
        </div>

      </div>

        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#mainNavbar"
        aria-controls="mainNavbar"
        aria-expanded="false"
        aria-label="Toggle navigation">

        <span class="navbar-toggler-icon"></span>
      </button>

      <!-- NAVIGATION -->
      <div class="collapse navbar-collapse" id="mainNavbar">

      
<ul class="navbar-nav ms-auto align-items-lg-center">

  <!-- HOME -->
  <li class="nav-item">
    <a class="nav-link"
       routerLink="/"
       routerLinkActive="active"
       [routerLinkActiveOptions]="{ exact: true }">

    </a>
  </li>

  <!-- ABOUT -->
  <li class="nav-item">
    <a class="nav-link"
       routerLink="/about"
       routerLinkActive="active">

    </a>
  </li>

  <!-- PRODUCTS -->
  <li class="nav-item">
    <a class="nav-link"
       routerLink="/product"
       routerLinkActive="active">

    </a>

  <li class="nav-item">
    <a class="nav-link"
       routerLink="/ServiceParts"
       routerLinkActive="active">

    </a>
  </li>

  <li class="nav-item quote-item">
    <a routerLink="/contact"
